[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muse"
version = "0.1.0"
description = "Multiscale operational world modeling for audit events"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<2", "torch>=2.4,<2.7"]

[project.scripts]
muse = "muse.cli:main"

[tool.setuptools.packages.find]
include = ["muse*"]
